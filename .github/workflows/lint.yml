# LINT — comprueba estilo y errores comunes con ruff (config en pyproject.toml).
# Cuándo usarlo: siempre. Es rápido (segundos) y falla antes que los tests,
# dando feedback inmediato sobre imports sin usar, formato, etc.
name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff check (reglas de calidad)
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: Ruff format (formato del código)
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
