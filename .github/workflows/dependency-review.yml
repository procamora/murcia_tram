# DEPENDENCY REVIEW — en cada PR avisa si introduce dependencias con
# vulnerabilidades conocidas o licencias problemáticas.
# Cuándo usarlo: cuando aceptas PRs (tuyos, de Dependabot o de terceros) que
# tocan requirements*.txt o workflows. Evita colar paquetes inseguros.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
